name: StylePro Mobile Validation

on:
  push:
    branches: [main]
    paths:
      - "stylepro-manager/mobile/**"
      - ".github/workflows/stylepro-mobile.yml"
  pull_request:
    paths:
      - "stylepro-manager/mobile/**"
      - ".github/workflows/stylepro-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stylepro-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stylepro-manager/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stylepro-manager/mobile/package-lock.json
      - run: npm install
      - name: Install Expo-compatible native packages
        run: npx expo install expo-print expo-sharing expo-sqlite expo-network
      - name: Commit Expo-compatible dependency lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git rebase origin/main
            git add package-lock.json
            git commit -m "chore(mobile): sync Expo SDK 58 dependency lockfile"
            git push origin HEAD:main
          fi
      - name: Check Expo package compatibility
        run: npx expo install --check
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: TypeScript validation
        run: npx tsc --noEmit
