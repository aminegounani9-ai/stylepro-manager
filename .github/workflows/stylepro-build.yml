name: StylePro build

on:
  push:
    branches: [main]
    paths:
      - "stylepro-manager/**"
      - ".github/workflows/stylepro-build.yml"
  pull_request:
    paths:
      - "stylepro-manager/**"
      - ".github/workflows/stylepro-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stylepro-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stylepro-manager/package-lock.json
      - run: npm ci
      - run: npm run build
