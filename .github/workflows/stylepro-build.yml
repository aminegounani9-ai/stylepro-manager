name: StylePro build

on:
  push:
    branches: [main]
    paths:
      - "stylepro-manager/**"
      - ".github/workflows/stylepro-build.yml"
  pull_request:
    paths:
      - "stylepro-manager/**"
      - ".github/workflows/stylepro-build.yml"
  workflow_dispatch:

concurrency:
  group: stylepro-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stylepro-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stylepro-manager/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Upload production web build
        uses: actions/upload-artifact@v4
        with:
          name: stylepro-web-dist
          path: stylepro-manager/dist/
          if-no-files-found: error
          retention-days: 14
