name: StylePro Android APK

on:
  push:
    branches: [main]
    paths:
      - "stylepro-manager/mobile/**"
      - ".github/workflows/stylepro-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stylepro-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: stylepro-manager/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stylepro-manager/mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Install Expo-compatible PDF modules
        run: npx expo install expo-print expo-sharing

      - name: Verify PDF dependencies
        run: npm ls expo-print expo-sharing

      - name: Check Expo package compatibility
        run: npx expo install --check

      - name: Validate Expo config
        run: npx expo config --type public

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone Android APK with embedded JavaScript bundle
        working-directory: stylepro-manager/mobile/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify standalone APK exists
        working-directory: stylepro-manager/mobile/android
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: stylepro-manager-android-standalone
          path: stylepro-manager/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
