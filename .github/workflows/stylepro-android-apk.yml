name: StylePro Android APK
# Rebuild the Android test APK alongside synchronized desktop and web releases.

on:
  push:
    branches: [main]
    paths:
      - "stylepro-manager/mobile/**"
      - ".github/workflows/stylepro-android-apk.yml"
  pull_request:
    paths:
      - "stylepro-manager/mobile/**"
      - ".github/workflows/stylepro-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stylepro-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: stylepro-manager/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stylepro-manager/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle distributions and dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm install
      - name: Check Expo packages
        run: |
          npx expo install --check
          npx expo config --type public
          npx tsc --noEmit
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone release APK
        working-directory: stylepro-manager/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleRelease; then
              exit 0
            fi
            echo "Gradle build attempt ${attempt} failed; retrying after a short delay..."
            sleep 15
          done
          echo "Gradle release build failed after 3 attempts."
          exit 1
      - name: Sign test APK with ephemeral CI key
        working-directory: stylepro-manager/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -s "$APK" ]; then
            APK="app/build/outputs/apk/release/app-release.apk"
          fi
          test -s "$APK"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/stylepro-ci.keystore" \
            -storepass stylepro-ci -keypass stylepro-ci \
            -alias stylepro-ci -dname "CN=StylePro CI,O=StylePro,C=DZ" \
            -keyalg RSA -keysize 2048 -validity 10000
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$APK" app/build/outputs/apk/release/StylePro-Manager-test-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.android/stylepro-ci.keystore" \
            --ks-key-alias stylepro-ci \
            --ks-pass pass:stylepro-ci \
            --key-pass pass:stylepro-ci \
            --out app/build/outputs/apk/release/StylePro-Manager-test.apk \
            app/build/outputs/apk/release/StylePro-Manager-test-aligned.apk
          "$BUILD_TOOLS/apksigner" verify app/build/outputs/apk/release/StylePro-Manager-test.apk
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: StylePro-Manager-Android-test-APK
          path: stylepro-manager/mobile/android/app/build/outputs/apk/release/StylePro-Manager-test.apk
          if-no-files-found: error
          retention-days: 14
