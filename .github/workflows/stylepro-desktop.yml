name: StylePro Desktop Windows

on:
  push:
    branches: [main]
    paths:
      - "stylepro-manager/**"
      - ".github/workflows/stylepro-desktop.yml"
  pull_request:
    paths:
      - "stylepro-manager/**"
      - ".github/workflows/stylepro-desktop.yml"
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL }}
    defaults:
      run:
        working-directory: stylepro-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stylepro-manager/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run lint
      - name: Verify desktop Supabase configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL) -or
              [string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_PUBLISHABLE_KEY)) {
            throw "Missing GitHub Actions secrets: VITE_SUPABASE_URL and/or VITE_SUPABASE_PUBLISHABLE_KEY. Add them in Settings > Secrets and variables > Actions."
          }
      - name: Build Windows installers
        run: npx --yes "@tauri-apps/cli@^2" build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: StylePro-Manager-Windows
          path: |
            stylepro-manager/src-tauri/target/release/bundle/nsis/*.exe
            stylepro-manager/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
